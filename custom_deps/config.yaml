name: Custom deps deployment
init: false
version: 1.3.5
slug: custom_deps
description: Manage custom Python modules in Home Assistant deps
url: https://github.com/home-assistant/apps-development
arch:
- aarch64
- amd64
startup: once
homeassistant: 2021.7.0
stage: experimental
boot: manual
map:
- config:rw
options:
  pypi:
  -
  apk: []
schema:
  pypi:
  - str
  apk:
  - str
image: ghcr.io/home-assistant/app-dev-custom_deps
